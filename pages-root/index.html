<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>アプリ一覧</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7f2;
        --surface: #ffffff;
        --line: #dfe5da;
        --text: #1b1f1a;
        --text-2: #5d6559;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          color-scheme: dark;
          --bg: #141613;
          --surface: #1d201c;
          --line: #333830;
          --text: #eef1ea;
          --text-2: #a9b1a4;
        }
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --bg: #141613;
        --surface: #1d201c;
        --line: #333830;
        --text: #eef1ea;
        --text-2: #a9b1a4;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif;
        line-height: 1.5;
      }
      main {
        max-width: 480px;
        margin: 0 auto;
        padding: calc(32px + env(safe-area-inset-top, 0px)) 16px 32px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 20px;
      }
      a {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px;
        margin-bottom: 12px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 18px;
        color: inherit;
        text-decoration: none;
      }
      a:active {
        transform: scale(0.99);
      }
      .emoji-icon {
        width: 52px;
        height: 52px;
        border-radius: 12px;
        flex: none;
        display: grid;
        place-items: center;
        font-size: 28px;
        background: #e2f2e8;
      }
      img {
        width: 52px;
        height: 52px;
        border-radius: 12px;
        flex: none;
      }
      b {
        display: block;
        font-size: 17px;
      }
      small {
        color: var(--text-2);
        font-size: 13px;
      }
      .arrow {
        margin-left: auto;
        color: var(--text-2);
        font-size: 22px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>アプリ一覧</h1>
      <a href="ap-prep/">
        <img src="ap-prep/icons/icon-192.png" alt="" />
        <span><b>AP 過去問トレーナー</b><small>応用情報技術者試験 科目A の過去問演習</small></span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
      <a href="https://claude.ai/artifact/QGZUbARtNr2SqhfSVvX355" target="_blank" rel="noopener">
        <span class="emoji-icon" aria-hidden="true">🍚</span>
        <span><b>ごはん記録</b><small>写真を撮るだけで Claude がカロリーを推定（claude.ai で開きます）</small></span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
      <a href="camp-note/">
        <img src="camp-note/icon-192.png" alt="" />
        <span><b>キャンプ場ノート</b><small>行ったキャンプ場を採点して、次のキャンプ場選びに使う記録帳</small></span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
    </main>
  </body>
</html>
