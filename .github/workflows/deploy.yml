name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/ap-exam-app-spec-bjvkom, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run validate-data
      - run: npm test
      # 試験アプリは /<リポジトリ名>/ap-prep/ に置く
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/ap-prep/
      # 食事管理アプリ（meal-app/）は claude.ai 上で公開するため、ここではテストだけ行う
      - run: npm ci && npm test
        working-directory: meal-app
      # 直下（/<リポジトリ名>/）にはアプリ一覧と、古い Service Worker を片付ける sw.js を置く
      # キャンプ場ノート（camp-note/）はビルド不要の1ページなので、そのまま /<リポジトリ名>/camp-note/ に置く
      - run: |
          mkdir site
          cp -r pages-root/. site/
          cp -r dist site/ap-prep
          cp -r camp-note site/camp-note
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
