name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/ap-exam-app-spec-bjvkom, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            meal-app/package-lock.json
      - run: npm ci
      - run: npm run validate-data
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # 食事管理アプリ（meal-app/）は /<リポジトリ名>/meal/ に置く
      - run: npm ci && npm test && npm run build
        working-directory: meal-app
        env:
          BASE_PATH: /${{ github.event.repository.name }}/meal/
      - run: cp -r meal-app/dist dist/meal
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
